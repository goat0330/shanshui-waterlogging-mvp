name: shanshui-waterlogging-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend smoke dependencies
        run: python -m pip install -r backend/requirements.txt opencv-python pillow requests websocket-client
      - name: Run backend smoke
        run: python -B backend/smoke.py

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  vision-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vision smoke dependencies
        run: python -m pip install -r backend/visiondepth_v2/requirements-mvp.txt pillow requests
      - name: Run image smoke
        run: python -m vision.smoke
      - name: Run VisionDepth contract tests
        working-directory: backend/visiondepth_v2
        run: python -m pytest -q
